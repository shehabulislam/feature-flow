services:
  # ── PostgreSQL ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: featureflow
      POSTGRES_PASSWORD: featureflow
      POSTGRES_DB: featureflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featureflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FeatureFlow App ──
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://featureflow:featureflow@db:5432/featureflow?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:-change-me-to-a-random-secret}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      # Optional: Stripe (uncomment and set for billing)
      # STRIPE_SECRET_KEY: ""
      # STRIPE_WEBHOOK_SECRET: ""
      # STRIPE_PRO_PRICE_ID: ""
      # STRIPE_TEAM_PRICE_ID: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
